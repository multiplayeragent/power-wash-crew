/* ═══ POWER WASH CREW · a Multiplayer Agent starter ═════════════════════════════════════
 * Blast a filthy backyard clean with pressure washers. Co-op, 1–4 players; bot washers help.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ nozzles (size, power, range), how clean is "done", stars, bots, the wire
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, live ops
 *   YARD .......... where the fence, deck, car, gnome and playground stand; what you can walk into
 *   SCENE ......... renderer, lights, lawn, house, trees, the washer cart
 *   SURFACES ...... a washable surface = a mesh + its dirt grid; the five objects built from them
 *   DIRT .......... dirt levels per cell, packing, reading/writing the shared fields, my overrides
 *   WASHING ....... spraying a dab (the same for me, bots and everyone's preview)
 *   JOB (HOST) .... a yard job: dirty it up, take wash intents, ding finished objects, results
 *   BOTS (HOST) ... bot washers: pick a surface, walk round what is in the way, sweep it row by row
 *   ME ............ walking, aiming through the camera, spraying, sending my cleaning
 *   OTHERS ........ other washers eased between snapshots, their spray drawn and previewed
 *   EFFECTS ....... water streams, splashes, glints, the 100% ding, pop-up text
 *   HUD & RESULTS . clock, grime, object meters, status, results card, leaderboard, sound
 *   INPUT ......... keys and mouse; touch stick, spray finger and the nozzle button
 *   MAIN LOOP ..... frame(), the camera, start()
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Every washable surface is a grid of cells, each 0 (clean) to 3 (caked mud). An object's
 *     cells are packed 2 bits each into ONE shared field `o0`…`o4`: {v, j: job id, d: done, g}.
 *   - Each player writes its OWN entity: `k` (one JSON field: position, facing, spraying,
 *     nozzle, the surface + spot it aims at) about 12 times a second, `n`/`c` (name, color)
 *     once and `hb` (heartbeat) once a second.
 *   - You wash on your own screen at once: cells under your spray lose a level right away (an
 *     override on top of the host's grid). Every 100ms you send the host "wash" {j, w: [object,
 *     cell, new level, …]}. Dirt only goes down, so the host keeps the LOWER level and credits
 *     you for each level removed; resending is harmless. Overrides the host hasn't taken after
 *     2s are sent again (the host may have changed).
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. It owns the dirt grids, runs the bots (their spray goes straight
 *     into its grids) and writes `job` (id, v, phase, seed, start time, everyone's grime, the
 *     results: ONE JSON field, `v` only goes up), the object fields and `bots` (~10/s).
 *     A new host adopts all of it from state and carries on.
 *   - Everyone previews everyone else's spray from their snapshots (drawn until the host's grid
 *     has it, or 2.5s), so other washers clean smoothly instead of in steps.
 *   - An object 98.5% clean "dings": the host wipes its last specks and sets `d`; every screen
 *     sees `d` flip and plays the ding. All five done = the job ends; results, then a new yard.
 *   - Leaderboard "grime-blasted": the most dirt levels a player removed in one yard.
 *   - Live ops: `washPower` multiplies every nozzle; running events show top right.
 *   - ?attract plays offline with bot washers only (the preview video is recorded from it).
 */

const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;

// ── YARD ────────────────────────────────────────────────────────────────────────────
// x runs east (right on screen), z runs south (toward the camera), y is up. Meters.
const WALK = { x0: -13.6, x1: 13.6, z0: -7.9, z1: 7.6 };    // where anyone can walk
const DECK = { x0: -14, x1: -8, z0: -4.5, z1: 2.5, h: 0.42 }; // a raised deck by the house: you can walk on it
const CAR = { x: 8, z: 3 };                                  // the car's middle (it is 4.2 long, 1.9 wide)
const GNOME = { x: -4.2, z: 3.4 };                           // a giant garden gnome
const PLAY = { x: 1.2, z: -5.2 };                            // the playhouse tower; its slide runs east
const CART = { x: -12.2, z: 5.6 };                           // the pressure-washer cart (just for looks)
const SOLIDS = [ // nobody walks through these: { x, z, r } circles and { x0, x1, z0, z1 } boxes
  { x0: CAR.x - 2.15, x1: CAR.x + 2.15, z0: CAR.z - 0.97, z1: CAR.z + 0.97 },
  { x: GNOME.x, z: GNOME.z, r: 0.62 },
  { x0: PLAY.x - 0.82, x1: PLAY.x + 0.82, z0: PLAY.z - 0.82, z1: PLAY.z + 0.82 },
  { x0: PLAY.x + 0.82, x1: PLAY.x + 3.6, z0: PLAY.z - 0.4, z1: PLAY.z + 0.4 },
  { x: CART.x, z: CART.z, r: 0.55 },

const onDeck = (x, z) => x <= DECK.x1 && z >= DECK.z0 && z <= DECK.z1;

// ── SCENE ───────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });

const scene = new THREE.Scene();
scene.background = new THREE.Color("#bfe3f7");
scene.fog = new THREE.Fog("#bfe3f7", 45, 95);
const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 200);

addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();
scene.add(new THREE.HemisphereLight("#ffffff", "#7d9a62", 1.4));

sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;

const seeded = mulberry32(42);
// The lawn, a paver path from the deck to the car's gravel pad, flower beds along the front edge.
const lawnTex = canvasTex(512, 512, (c, w, h) => {

}, 8, 6);
const lawn = add(new THREE.PlaneGeometry(60, 44).rotateX(-Math.PI / 2), mat("#ffffff", { map: lawnTex, roughness: 1 }), 0, 0, 0, false);

add(new THREE.BoxGeometry(27, 0.14, 0.8), bedMat, 0, 0.07, 8.7, false);

// The house on the west side (its back wall, a door onto the deck, windows) and a hedge on the east.
const siding = canvasTex(512, 256, (c, w, h) => {

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);

let overFor = -1, startedAt = 0, myModel = null, board = null, objsHtml = "";

  if (!d) return;

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, lastPrune = 0, camReady = false;

(async function start() {

  net.onReconnect(() => { reconnecting = false; });
